version: '3.8'

services:
  app:
    build: .
    container_name: fastapi-line-gemini
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./sessions.db:/app/sessions.db
      - ../Yosafe:/app/yosafe
    environment:
      - YOSAFE_PATH=/app/yosafe
    restart: unless-stopped
 